services:
  - type: web
    name: forge-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: BRAIINS_API_TOKEN
        sync: false
      - key: CORS_ORIGINS
        sync: false
